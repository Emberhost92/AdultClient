name: Import public release sources
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Program release tag
        required: true
        default: v0.3.0-beta.1
permissions:
  contents: write
concurrency:
  group: import-public-sources
  cancel-in-progress: false
jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download verified public program
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ac-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'program-update.json' --pattern '*-Windows.zip' --dir "$RUNNER_TEMP/ac-release"
      - name: Import verified public sources
        run: python3 .github/scripts/import_release_source.py "$RUNNER_TEMP/ac-release"
      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app addon MediaScraper release_tools licenses LICENSE release.json SOURCE-VERSION.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified public program source snapshot"
            git push origin HEAD:main
          fi
